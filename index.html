<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Kentucky Derby — Race 12 Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inconsolata:wght@400;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --dirt: #8B6914;
    --track: #C4952A;
    --cream: #F5EDD6;
    --dark: #1A1208;
    --rose: #8C1A1A;
    --gold: #D4A017;
    --ink: #2C1F07;
    --muted: #7A6A4A;
    --panel: #EDE4C8;
    --win: #1A5C1A;
    --place: #1A3A7A;
    --show: #6B1A6B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--dark);
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(212,160,23,0.06) 39px, rgba(212,160,23,0.06) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(212,160,23,0.04) 39px, rgba(212,160,23,0.04) 40px);
    color: var(--cream);
    font-family: 'Libre Baskerville', serif;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(180deg, #0D0800 0%, #1A1208 60%, var(--dark) 100%);
    border-bottom: 3px solid var(--gold);
    padding: 24px 32px 18px;
    text-align: center;
    position: relative;
  }

  header::before, header::after {
    content: '✦';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 22px;
    opacity: 0.7;
  }
  header::before { left: 32px; }
  header::after { right: 32px; }

  .header-eyebrow {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--track);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 4vw, 42px);
    font-weight: 900;
    color: var(--gold);
    line-height: 1.1;
    text-shadow: 0 2px 12px rgba(212,160,23,0.3);
    letter-spacing: 0.02em;
  }

  .header-sub {
    font-family: 'Inconsolata', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.15em;
  }

  .header-purse {
    display: inline-block;
    margin-top: 10px;
    background: var(--rose);
    border: 1px solid #C04040;
    color: var(--cream);
    font-family: 'Inconsolata', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 4px 14px;
    border-radius: 2px;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 130px);
    min-height: 500px;
  }

  /* SIDEBAR */
  .sidebar {
    background: #120D04;
    border-right: 2px solid rgba(212,160,23,0.25);
    overflow-y: auto;
    padding: 12px 0;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: #0D0800; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--dirt); }

  .sidebar-label {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 16px 8px;
    border-bottom: 1px solid rgba(212,160,23,0.12);
    margin-bottom: 6px;
  }

  .horse-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 16px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    position: relative;
  }

  .horse-btn:hover { background: rgba(212,160,23,0.07); }
  .horse-btn.active {
    background: rgba(212,160,23,0.13);
    border-left-color: var(--gold);
  }

  .horse-pp {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inconsolata', monospace;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.15);
    color: #fff;
  }

  .horse-info { flex: 1; min-width: 0; }

  .horse-name {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .horse-meta {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }

  .horse-odds {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--track);
    flex-shrink: 0;
  }

  .ae-divider {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--rose);
    padding: 10px 16px 6px;
    border-bottom: 1px dashed rgba(140,26,26,0.4);
    margin: 4px 0;
  }

  /* MAIN PANEL */
  .main {
    overflow-y: auto;
    background: var(--panel);
    color: var(--ink);
  }

  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-track { background: var(--cream); }
  .main::-webkit-scrollbar-thumb { background: var(--dirt); }

  .no-selection {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
    padding: 40px;
  }

  .no-selection .icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .no-selection p {
    font-style: italic;
    font-size: 15px;
    color: var(--muted);
  }

  .horse-detail {
    padding: 28px 32px 40px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .detail-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--dirt);
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .detail-pp-badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: #fff;
    flex-shrink: 0;
    border: 3px solid rgba(255,255,255,0.3);
    box-shadow: 0 3px 12px rgba(0,0,0,0.4);
  }

  .detail-name-block { flex: 1; }

  .detail-horse-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 900;
    color: var(--dark);
    line-height: 1.1;
  }

  .detail-horse-name .ae-tag {
    font-size: 13px;
    color: var(--rose);
    font-family: 'Inconsolata', monospace;
    margin-left: 8px;
  }

  .detail-lineage {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    font-style: italic;
    line-height: 1.5;
  }

  .detail-right {
    text-align: right;
    flex-shrink: 0;
  }

  .detail-odds {
    font-family: 'Inconsolata', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--rose);
  }

  .detail-odds-label {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-title {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(0,0,0,0.1);
  }

  /* Stats grid */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .stat-card {
    background: var(--cream);
    border: 1px solid rgba(139,105,20,0.2);
    border-radius: 3px;
    padding: 12px 14px;
  }

  .stat-card-label {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-card-value {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--dark);
  }

  .stat-card-sub {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Record table */
  .record-table {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 1px;
    background: rgba(0,0,0,0.15);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
  }

  .rt-header {
    background: var(--dark);
    color: var(--gold);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 7px 10px;
    text-align: center;
  }

  .rt-label {
    background: rgba(0,0,0,0.08);
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 10px;
    display: flex;
    align-items: center;
  }

  .rt-cell {
    background: var(--cream);
    padding: 6px 10px;
    text-align: center;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rt-cell.win { color: var(--win); font-weight: 700; }
  .rt-cell.place { color: var(--place); font-weight: 700; }
  .rt-cell.show { color: var(--show); font-weight: 700; }
  .rt-cell.earnings { font-size: 10px; }

  /* Past races */
  .past-race {
    background: var(--cream);
    border: 1px solid rgba(139,105,20,0.18);
    border-radius: 3px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 12px;
    transition: border-color 0.15s;
  }

  .past-race:hover { border-color: var(--dirt); }

  .past-race-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .past-race-date {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
  }

  .past-race-name {
    font-weight: 700;
    color: var(--dark);
    font-size: 13px;
    flex: 1;
  }

  .past-race-finish {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: 8px;
  }

  .finish-1 { background: var(--win); color: #fff; }
  .finish-2 { background: var(--place); color: #fff; }
  .finish-3 { background: var(--show); color: #fff; }
  .finish-other { background: rgba(0,0,0,0.1); color: var(--muted); }

  .past-race-detail {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.5;
  }

  .past-race-detail span { margin-right: 12px; }

  .past-race-comment {
    font-style: italic;
    color: var(--ink);
    margin-top: 4px;
    font-size: 11px;
    opacity: 0.8;
  }

  /* Connections */
  .connections-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }

  .connection-card {
    background: var(--cream);
    border: 1px solid rgba(139,105,20,0.18);
    border-radius: 3px;
    padding: 10px 12px;
  }

  .connection-role {
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .connection-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--dark);
  }

  .connection-stats {
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Workouts */
  .workout-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 22px;
  }

  .workout-pill {
    background: var(--cream);
    border: 1px solid rgba(139,105,20,0.2);
    border-radius: 2px;
    padding: 5px 10px;
    font-family: 'Inconsolata', monospace;
    font-size: 10px;
    color: var(--ink);
  }

  /* silks color swatch */
  .silks-block {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--cream);
    border: 1px solid rgba(139,105,20,0.18);
    border-radius: 3px;
    padding: 10px 14px;
    margin-bottom: 22px;
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
  }

  .section-block { margin-bottom: 24px; }

  /* Equipment changes badge */
  .equipment-badge {
    display: inline-block;
    background: #8B4513;
    color: #FFE4B5;
    font-family: 'Inconsolata', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding: 2px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    margin-left: 8px;
    vertical-align: middle;
  }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .sidebar { height: 200px; display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding: 8px; gap: 6px; }
    .sidebar-label, .ae-divider { display: none; }
    .horse-btn { flex-direction: column; align-items: center; width: auto; min-width: 70px; padding: 8px; border-left: none; border-bottom: 3px solid transparent; }
    .horse-btn.active { border-bottom-color: var(--gold); }
    .horse-info { text-align: center; }
    .horse-name { font-size: 10px; }
    .horse-meta, .horse-odds { display: none; }
    .main { height: calc(100vh - 330px); min-height: 400px; }
  }
</style>
</head>

function getTextColor(bgColor) {
  const hex = bgColor.replace('#','');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  const luminance=(0.299*r+0.587*g+0.114*b)/255;
  return luminance > 0.55 ? '#1a1208' : '#ffffff';
}

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<div class="sidebar-label">Post · Horse · Odds</div>';
  
  const starters = horses.filter(h => !h.ae);
  const aes = horses.filter(h => h.ae);
  
  starters.forEach(h => {
    const bg = PP_COLORS[h.pp] || '#888';
    const fg = getTextColor(bg);
    html += `<button class="horse-btn" onclick="selectHorse(${h.pp})" id="btn-${h.pp}">
      <div class="horse-pp" style="background:${bg};color:${fg}">${h.pp}</div>
      <div class="horse-info">
        <div class="horse-name">${h.name}</div>
        <div class="horse-meta">${h.trainer}</div>
      </div>
      <div class="horse-odds">${h.odds}</div>
    </button>`;
  });
  
  html += '<div class="ae-divider">⬇ Also Eligible</div>';
  aes.forEach(h => {
    const bg = PP_COLORS[h.pp] || '#888';
    const fg = getTextColor(bg);
    html += `<button class="horse-btn" onclick="selectHorse(${h.pp})" id="btn-${h.pp}">
      <div class="horse-pp" style="background:${bg};color:${fg};font-size:9px">${h.pp}</div>
      <div class="horse-info">
        <div class="horse-name">${h.name}</div>
        <div class="horse-meta">${h.trainer}</div>
      </div>
      <div class="horse-odds">${h.odds}</div>
    </button>`;
  });

  sb.innerHTML = html;
}

function finishClass(n) {
  if (n === 1) return 'finish-1';
  if (n === 2) return 'finish-2';
  if (n === 3) return 'finish-3';
  return 'finish-other';
}

function selectHorse(pp) {
  document.querySelectorAll('.horse-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-'+pp);
  if (btn) btn.classList.add('active');

  const h = horses.find(x => x.pp === pp);
  if (!h) return;

  const bg = PP_COLORS[h.pp] || '#888';
  const fg = getTextColor(bg);

  const recordKeys = ['2026','2025','Life','Dirt','CD'];
  let recordHTML = `
    <div class="record-table">
      <div class="rt-header" style="grid-column:1"></div>
      <div class="rt-header">Starts</div>
      <div class="rt-header">1st</div>
      <div class="rt-header">2nd</div>
      <div class="rt-header">3rd</div>
      <div class="rt-header">Earnings</div>
  `;
  recordKeys.forEach(k => {
    const r = h.records[k];
    recordHTML += `
      <div class="rt-label">${k}</div>
      <div class="rt-cell">${r.starts}</div>
      <div class="rt-cell win">${r.wins}</div>
      <div class="rt-cell place">${r.places}</div>
      <div class="rt-cell show">${r.shows}</div>
      <div class="rt-cell earnings">${r.earn}</div>
    `;
  });
  recordHTML += '</div>';

  let racesHTML = '';
  h.races.forEach(r => {
    racesHTML += `
      <div class="past-race">
        <div class="past-race-top">
          <div>
            <div class="past-race-date">${r.date} — ${r.track} ${r.surface}</div>
            <div class="past-race-name">${r.race}</div>
          </div>
          <div class="past-race-finish ${finishClass(r.finish)}">${r.finish}</div>
        </div>
        <div class="past-race-detail">
          <span>Dist: ${r.dist}</span>
          <span>Odds: ${r.odds}</span>
          <span class="past-race-comment">${r.comment}</span>
        </div>
      </div>
    `;
  });

  let workoutsHTML = h.workouts.map(w => `<div class="workout-pill">${w}</div>`).join('');

  const eqBadge = h.equipment ? `<span class="equipment-badge">⚑ ${h.equipment}</span>` : '';

  document.getElementById('main').innerHTML = `
    <div class="horse-detail">
      <div class="detail-header">
        <div class="detail-pp-badge" style="background:${bg};color:${fg}">${h.pp}</div>
        <div class="detail-name-block">
          <div class="detail-horse-name">
            ${h.name}${h.ae ? '<span class="ae-tag">AE</span>' : ''}
            ${eqBadge}
          </div>
          <div class="detail-lineage">${h.color} · By ${h.sire} — ${h.dam}<br>Bred in ${h.bred} · ${h.dob} · ${h.sale}</div>
        </div>
        <div class="detail-right">
          <div class="detail-odds-label">Morning Line</div>
          <div class="detail-odds">${h.odds}</div>
          <div class="detail-odds-label" style="margin-top:8px">Weight</div>
          <div style="font-family:'Inconsolata',monospace;font-size:16px;font-weight:700;color:var(--dark)">${h.weight} lbs</div>
        </div>
      </div>

      <div class="connections-grid">
        <div class="connection-card">
          <div class="connection-role">Owner</div>
          <div class="connection-name" style="font-size:11px">${h.owner}</div>
        </div>
        <div class="connection-card">
          <div class="connection-role">Trainer</div>
          <div class="connection-name">${h.trainer}</div>
          <div class="connection-stats">${h.trainerStats}</div>
        </div>
        <div class="connection-card">
          <div class="connection-role">Jockey</div>
          <div class="connection-name">${h.jockey}</div>
        </div>
        <div class="connection-card">
          <div class="connection-role">Silks</div>
          <div class="connection-name" style="font-size:11px;font-style:italic;font-weight:400">${h.silks}</div>
        </div>
      </div>

      <div class="section-block">
        <div class="section-title">Race Record</div>
        ${recordHTML}
      </div>

      <div class="section-block">
        <div class="section-title">Past Performances (${h.races.length} races shown)</div>
        ${racesHTML}
      </div>

      <div class="section-block">
        <div class="section-title">Recent Workouts</div>
        <div class="workout-list">${workoutsHTML}</div>
      </div>
    </div>
  `;
}

buildSidebar();
</script>
</body>
</html>
